name: proposal-poster
on:
  repository_dispatch:
    types: [poll]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default) or post"
        required: false
        default: "dry-run"
      issue_number:
        description: "Issue number (re-arm actions only)"
        required: false
        default: ""
      action:
        description: "none, re-arm-only, re-arm-and-post"
        required: false
        default: "none"
      proposal_body:
        description: "Proposal markdown (re-arm actions only)"
        required: false
        default: ""
concurrency:
  group: proposal-poster-${{ github.event_name == 'workflow_dispatch' && 'manual' || ((endsWith(format('{0}', github.run_number), '0') || endsWith(format('{0}', github.run_number), '2') || endsWith(format('{0}', github.run_number), '4') || endsWith(format('{0}', github.run_number), '6') || endsWith(format('{0}', github.run_number), '8')) && 'a' || 'b') }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private content
        uses: actions/checkout@v5
        with:
          repository: M00rish/Dscan
          token: ${{ secrets.DSCAN_PAT }}
          path: content
          sparse-checkout: |
            proposal-bot
            proposals
      - name: Run poster
        working-directory: content
        env:
          GH_TOKEN: ${{ secrets.M00RISH_PAT }}
          DSCAN_TOKEN: ${{ secrets.DSCAN_PAT }}
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'repository_dispatch' && 'post') || 'dry-run' }}
          DISPATCH_ACTION: ${{ github.event.inputs.action || 'none' }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue_number || '' }}
          DISPATCH_BODY: ${{ github.event.inputs.proposal_body || '' }}
          GITHUB_STEP_SUMMARY: ""
          # Lane b hands over 150s after lane a. Each run polls until its lane's next
          # 5-minute mark (at least 150s), so handovers never line up.
          LANE_OFFSET: ${{ (endsWith(format('{0}', github.run_number), '0') || endsWith(format('{0}', github.run_number), '2') || endsWith(format('{0}', github.run_number), '4') || endsWith(format('{0}', github.run_number), '6') || endsWith(format('{0}', github.run_number), '8')) && '0' || '150' }}
          POLL_SECONDS: "1"
        run: |
          now=$(date +%s)
          end=$(( (now - LANE_OFFSET) / 300 * 300 + LANE_OFFSET + 300 ))
          (( end - now < 150 )) && end=$((end + 300))
          echo "Lane offset ${LANE_OFFSET}s: polling until $(date -u -d "@$end" +%T) UTC"
          if [[ "$MODE" == "post" ]]; then
            ./proposal-bot/lock.sh prepare
          else
            ./proposal-bot/lock.sh selftest || echo "::warning::lock selftest failed; check DSCAN_PAT (Contents read/write on M00rish/Dscan)"
          fi
          ./proposal-bot/post.sh
          while (( $(date +%s) + POLL_SECONDS < end )); do
            sleep "$POLL_SECONDS"
            if ./proposal-bot/watch.sh; then
              # The dispatch action (re-arm) only applies to the first run above.
              DISPATCH_ACTION=none ./proposal-bot/post.sh
            fi
          done
      - name: Commit state back to Dscan
        working-directory: content
        run: ./proposal-bot/save-state.sh
