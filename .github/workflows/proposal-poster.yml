name: proposal-poster
on:
  repository_dispatch:
    types: [poll]
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (default) or post"
        required: false
        default: "dry-run"
      issue_number:
        description: "Issue number (re-arm actions only)"
        required: false
        default: ""
      action:
        description: "none, re-arm-only, re-arm-and-post"
        required: false
        default: "none"
      proposal_body:
        description: "Proposal markdown (re-arm actions only)"
        required: false
        default: ""
concurrency:
  group: proposal-poster
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private content
        uses: actions/checkout@v5
        with:
          repository: M00rish/Dscan
          token: ${{ secrets.DSCAN_PAT }}
          path: content
          sparse-checkout: |
            proposal-bot
            proposals
      - name: Run poster
        working-directory: content
        env:
          GH_TOKEN: ${{ secrets.M00RISH_PAT }}
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'repository_dispatch' && 'post') || 'dry-run' }}
          DISPATCH_ACTION: ${{ github.event.inputs.action || 'none' }}
          DISPATCH_ISSUE: ${{ github.event.inputs.issue_number || '' }}
          DISPATCH_BODY: ${{ github.event.inputs.proposal_body || '' }}
          GITHUB_STEP_SUMMARY: ""
          # Each run polls for ~5 minutes; cron-job.org dispatches every minute and the
          # concurrency group keeps one queued run, so the next run starts right after
          # this one. watch.sh uses conditional requests (304s are free) and posts on a hit.
          LOOP_SECONDS: "290"
          POLL_SECONDS: "1"
        run: |
          ./proposal-bot/post.sh
          end=$((SECONDS + LOOP_SECONDS))
          while (( SECONDS + POLL_SECONDS < end )); do
            sleep "$POLL_SECONDS"
            if ./proposal-bot/watch.sh; then
              # The dispatch action (re-arm) only applies to the first run above.
              DISPATCH_ACTION=none ./proposal-bot/post.sh
            fi
          done
      - name: Commit state back to Dscan
        working-directory: content
        run: |
          # post.sh rewrites last_run_at every run; commit only real transitions.
          same_state() {
            [[ "$(git show HEAD:proposal-bot/state.json | jq -S 'del(.last_run_at)')" == \
               "$(jq -S 'del(.last_run_at)' proposal-bot/state.json)" ]]
          }
          if git diff --quiet HEAD -- proposals && same_state; then
            echo "No state changes."
            exit 0
          fi
          git add -A proposal-bot proposals
          git -c user.name="proposal-poster" -c user.email="proposal-poster@users.noreply.github.com" \
            commit -m "proposal-poster: update state $(date -u +%FT%TZ)"
          # Dscan sessions and the daily scan push to main too: rebase and retry.
          for i in 1 2 3; do
            git pull --rebase -q origin HEAD && git push origin HEAD && exit 0
            sleep $((i * 2))
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
